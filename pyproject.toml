[project]
name = "filial-bsb"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4", "Flask-SQLAlchemy>=3.1,<4", "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2", "Flask-Migrate>=4.1,<5", "Werkzeug>=3.1,<4", "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2", "gunicorn>=23,<24"
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
