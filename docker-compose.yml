services:
  # Serviço que (re)constrói o banco a partir do schema.sql + dados de teste.
  # Já existia antes; mantido aqui sem alterações.
  mudancas-db:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    command: python setup_db.py

  # Novo serviço: o web app de inserção de dados.
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    working_dir: /app
    volumes:
      # Mesma pasta do projeto montada aqui também, para o app.py
      # acessar o mesmo mudancas_filial.db e a pasta templates/.
      - ./:/app
    ports:
      - "5000:5000"
    command: python app.py
