<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Filial Brasília{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('web.dashboard') }}">Filial Brasília</a>{% if session.usuario_id %}<nav><a href="{{ url_for('web.dashboard') }}">Painel</a><a href="{{ url_for('web.processos') }}">Processos</a><form method="post" action="{{ url_for('web.logout') }}"><button>Sair</button></form></nav>{% endif %}</header>
<main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p class="alert {{category}}">{{message}}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
