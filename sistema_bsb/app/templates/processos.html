{% extends 'base.html' %}{% block content %}<div class="section-title"><h1>Processos</h1><div><a class="button" href="{{url_for('web.export_csv',**filtros)}}">CSV</a> <a class="button" href="{{url_for('web.export_xlsx',**filtros)}}">XLSX</a></div></div><form class="filters"><input name="q" value="{{filtros.get('q','')}}" placeholder="Código ou cliente"><select name="status_agenda"><option value="">Toda agenda</option><option value="agendado">Agendado</option><option value="nao_agendado">Não agendado</option></select><button>Filtrar</button></form><section class="card"><table><thead><tr><th>Código</th><th>Cliente</th><th>Tipo</th><th>Agenda</th><th>Operação</th></tr></thead><tbody>{% for p in processos %}<tr><td><a href="{{url_for('web.processo',uuid=p.id)}}">{{p.codigo}}</a></td><td>{{p.cliente.nome}}</td><td>{{p.tipo}}</td><td>{{p.status_agenda}}</td><td>{{p.status_operacao}}</td></tr>{% else %}<tr><td colspan="5">Nada encontrado.</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
